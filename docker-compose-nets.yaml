networks:
  # net1:
  #   internal: true
  net2:


services:

  server_vpn:
    build:
      context: ./images/server_vpn
      args:
        WD: .
        IMAGE_NAME: server_vpn
        IMAGE_TAG: latest
    image: localhost/server_vpn:latest
    # dont change container name
    container_name: server_vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    devices:
      - "/dev/net/tun:/dev/net/tun"
    networks:
      # net1:
      net2:
    ports:
      - 989:989
      - 990:990
      - 500:500/udp
      - 4500:4500/udp
    environment:
      - VPN_DNS_ZONE=$VPN_DNS_ZONE
      - PUBLIC_DNS4=${PUBLIC_DNS4:-}
      - PUBLIC_DNS6=${PUBLIC_DNS6:-}
      - PUBLIC_STRONG_PORT=${PUBLIC_STRONG_PORT:-}
      - PUBLIC_COMPAT_PORT=${PUBLIC_COMPAT_PORT:-}
      - OVPN_STRONG_NET4=${OVPN_STRONG_NET4:-}
      - OVPN_COMPAT_NET4=${OVPN_COMPAT_NET4:-}
      - SWAN_SERVER_NET4=${SWAN_SERVER_NET4:-}
      - OVPN_STRONG_NET6=${OVPN_STRONG_NET6:-}
      - OVPN_COMPAT_NET6=${OVPN_COMPAT_NET6:-}
      - SWAN_SERVER_NET6=${SWAN_SERVER_NET6:-}
      - PUBLIC_DNS_NAME=${PUBLIC_DNS_NAME:-}
    hostname: server_vpn
    dns:
      - 127.0.0.1
      - ::1
    volumes:
      - ./pki:/pki:r
      - ./vpn:/vpn:r
      - ./stat:/vpnstat
